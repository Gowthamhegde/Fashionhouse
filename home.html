<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionHouse - Style Redefined</title>
    <link rel="stylesheet" href="home-styles.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Fashion<span>House</span></div>
        <div class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Collections</a>
            <a href="#">Trending</a>
            <a href="#">Lookbook</a>
            <a href="index.html" class="login-btn">Login</a>
        </div>
    </nav>

    <div class="hero">
        <div class="hero-content">
            <div class="avatar-container">
                <div class="avatar">
                    <div class="avatar-circle"></div>
                    <img src="https://assets.codepen.io/1462889/fashion-avatar.png" alt="Fashion Avatar">
                </div>
            </div>
            <h1 class="animated-title">Redefine Your Style</h1>
            <p class="animated-text">Discover the latest trends in fashion and express yourself</p>
            <div class="cta-container">
                <button class="cta-button">Explore Collection</button>
                <button class="cta-button secondary">Watch Showcase</button>
            </div>
        </div>
        <div class="interactive-elements">
            <div class="floating-card" data-tilt>
                <i class="fas fa-tshirt"></i>
                <h3>Premium Fashion</h3>
            </div>
            <div class="floating-card" data-tilt>
                <i class="fas fa-star"></i>
                <h3>Trending Styles</h3>
            </div>
            <div class="floating-card" data-tilt>
                <i class="fas fa-gem"></i>
                <h3>Luxury Brands</h3>
            </div>
        </div>
    </div>

    <!-- Adding Login/Signup Modal -->
    <div class="auth-modal" id="authModal">
        <div class="background">
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
        <div class="container">
            <div class="form-container">
                <!-- Login Form -->
                <div class="form-box login">
                    <span class="close-modal">&times;</span>
                    <h2><i class="fas fa-user-circle"></i> Login</h2>
                    <form id="loginForm">
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" placeholder="Email" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="Password" required>
                        </div>
                        <button type="submit" class="gradient-button">Login</button>
                    </form>
                    <p>Don't have an account? <span class="toggle-form" data-form="signup">Sign up</span></p>
                </div>

                <!-- Signup Form -->
                <div class="form-box signup hidden">
                    <span class="close-modal">&times;</span>
                    <h2><i class="fas fa-user-plus"></i> Sign Up</h2>
                    <form id="signupForm">
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" placeholder="Full Name" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" placeholder="Email" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="Password" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-key"></i>
                            <input type="password" placeholder="Confirm Password" required>
                        </div>
                        <button type="submit" class="gradient-button">Sign Up</button>
                    </form>
                    <p>Already have an account? <span class="toggle-form" data-form="login">Login</span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script src="home-script.js"></script>
    <script src="script.js"></script>
</body>
</html>
